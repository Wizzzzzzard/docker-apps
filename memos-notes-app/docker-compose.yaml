services:
  memos:
    container_name: memos
    image: neosmemo/memos:stable
    restart: unless-stopped
    ports:
      - "5230:5230"
    volumes:
      - /data/notes:/var/opt/memos
    environment:
      - TZ=Europe/London
      - MEMOS_PORT=5230
      - MEMOS_DRIVER=sqlite
      - MEMOS_INSTANCE_URL="https://notes.34-anniesland-home.uk"
